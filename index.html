<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" sizes="192x192" href="icons/ghis-exp-192.png">
<link rel="apple-touch-icon" href="icons/ghis-exp-192.png">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e7eaf0;--accent:#2563eb;--accent2:#0f766e;--danger:#dc2626;--warn:#d97706;--shadow:0 8px 30px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:800;padding:8px 10px 24px}.brand small{display:block;color:#9ca3af;font-size:11px;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#d1d5db;text-align:right;padding:13px 12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.main{flex:1;padding:24px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.title h1{margin:0;font-size:27px}.title p{margin:6px 0;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap}.field{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:145px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:24px;font-weight:800;margin-top:8px}.metric .sub{font-size:12px;color:var(--muted);margin-top:5px}.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.type{transition:.15s;border:1px solid var(--line);background:#fff;border-radius:15px;padding:18px;text-align:right}.type:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cbd5e1}.icon{font-size:27px}.type h3{margin:12px 0 5px;font-size:16px}.type .amt{font-weight:800;font-size:18px}.type small{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px}.panel h2{margin:0 0 14px;font-size:19px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#1d4ed8}.btn.green{background:#0f766e}.btn.danger{background:#fee2e2;color:#991b1b}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:13px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.hidden{display:none}.modal.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:22px}.close{float:left;border:0;background:#f1f5f9;border-radius:8px;padding:7px 10px}.notice{padding:12px 14px;background:#eff6ff;border-right:4px solid var(--accent);border-radius:8px;color:#1e3a8a;margin-bottom:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}@media(max-width:1100px){.types{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.app{display:block}.side{width:100%;height:auto;position:static}.types{grid-template-columns:repeat(2,1fr)}.top{display:block}.filters{margin-top:12px}.cards{grid-template-columns:1fr 1fr}.main{padding:14px}}

/* ===== Item Review additions — same visual language, no overrides ===== */
.pill.neutral{background:#f1f5f9;color:#475569}
.prog{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:9px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:.2s}
.type .prog{margin-top:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.chip:hover{border-color:#cbd5e1}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .c{opacity:.75;margin-inline-start:5px;font-weight:400}
.ir-search{min-width:230px}
.sub-id{display:block;color:var(--muted);font-size:11px;margin-top:3px;direction:ltr;text-align:start}
.srcbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:6px 11px;font-size:13px}
.srcbtn:hover{border-color:#cbd5e1}
.srcrow>td{background:#f8fafc;padding:0}
.srcinner{padding:12px 14px}
.srctable{min-width:0;margin:0}
.srctable th,.srctable td{padding:7px 9px;font-size:13px;border-bottom:1px solid #eef2f7}
.srctable tr:last-child td{border-bottom:0}
.srctable .mo{white-space:normal;max-width:210px;line-height:1.7}
.price-ro{display:inline-block;min-width:118px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:700;text-align:start}
.price-ro.empty{color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.ir-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ir-prog-line{font-size:13px;color:var(--muted)}
.ir-prog-line b{color:var(--ink);font-size:15px}
.ro-note{padding:12px 14px;background:#fffbeb;border-inline-start:4px solid var(--warn);border-radius:8px;color:#92400e;margin-bottom:14px;font-size:13px}
.langsw{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.langsw button{border:0;background:transparent;padding:9px 13px;font-size:13px;font-weight:700;color:var(--muted)}
.langsw button.active{background:var(--accent);color:#fff}
html[dir=ltr] .nav button,html[dir=ltr] .type,html[dir=ltr] th,html[dir=ltr] td{text-align:left}
html[dir=ltr] .close{float:right}
html[dir=ltr] .notice{border-right:0;border-left:4px solid var(--accent)}
/* ===== Prototype Item Management — sandbox editing ===== */
.sbx{padding:12px 14px;background:#eff6ff;border-inline-start:4px solid var(--accent);border-radius:8px;color:#1e40af;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sbx b{color:#1d4ed8}
.inp{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);width:100%;box-sizing:border-box}
.inp:focus{outline:0;border-color:var(--accent)}
.inp.err{border-color:var(--danger);background:#fef2f2}
.inp.num{max-width:96px;text-align:start}
.inp.price{max-width:130px;font-weight:700}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frm .full{grid-column:1/-1}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.errmsg{font-size:12px;color:var(--danger);margin-top:5px;min-height:15px}
.rowacts{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:7px 11px;font-size:12px}
.inactive-row td{opacity:.55}
.qty-cell{white-space:nowrap}
.qty-cell .sep{color:var(--muted);margin:0 4px}
.unconstrained{color:var(--muted);font-size:12px}
/* ===== Monthly Budget Execution Report ===== */
.rep-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.rep-f{display:flex;flex-direction:column;gap:6px}
.rep-f .lbl{margin:0}
.months-box{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;max-width:100%}
.months-grid{display:grid;grid-template-columns:repeat(6,minmax(92px,1fr));gap:8px}
.mchk{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.mchk input{width:15px;height:15px;accent-color:var(--accent)}
.months-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.num.neg{color:var(--danger)}
.num.zero{color:var(--muted);font-weight:400}
tr.total-row td{background:#f8fafc;font-weight:800;border-top:2px solid var(--line)}
tr.over-row td{background:#fef2f2}

/* ===== Distribution (STEP 2) ===== */
.dist-f{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.dist-f .rep-f{min-width:170px}
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.res-status{padding:13px 15px;border-radius:10px;font-weight:700;font-size:14px;margin-bottom:14px}
.rs-exact{background:#dcfce7;color:#166534;border-inline-start:4px solid var(--accent2)}
.rs-partial{background:#dcfce7;color:#166534;border-inline-start:4px solid var(--accent2)}
.rs-closest{background:#fef3c7;color:#92400e;border-inline-start:4px solid var(--warn)}
.rs-infeasible{background:#fee2e2;color:#991b1b;border-inline-start:4px solid var(--danger)}
.rs-over{background:#fee2e2;color:#991b1b;border-inline-start:4px solid var(--danger)}
.rs-sub{font-weight:400;font-size:13px;margin-top:6px;opacity:.9}
.excl-tbl td{font-size:13px}
.invrow>td{background:#f8fafc;padding:0}

/* ===== Master Items & Prices ===== */
.mi-in{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;width:100%;box-sizing:border-box;max-width:120px}
.mi-in:focus{outline:0;border-color:var(--accent)}
.mi-in.err{border-color:var(--danger);background:#fef2f2}
.mi-in[readonly]{background:#f8fafc;color:var(--muted)}
.mi-note{padding:11px 13px;background:#eff6ff;border-inline-start:4px solid var(--accent);border-radius:8px;color:#1e40af;font-size:13px;margin-bottom:14px}
.mi-warn{padding:11px 13px;background:#fffbeb;border-inline-start:4px solid var(--warn);border-radius:8px;color:#92400e;font-size:13px;margin-bottom:14px}
.mi-ok{padding:11px 13px;background:#dcfce7;border-inline-start:4px solid var(--accent2);border-radius:8px;color:#166534;font-size:13px;margin-bottom:14px}
.mi-when{font-size:12px;color:var(--muted);white-space:nowrap}
.bh-sub>td{background:#f8fafc;padding:0}
.bh-inner{padding:12px 14px}
.bh-t{min-width:0;margin:0}
.bh-t th,.bh-t td{padding:7px 9px;font-size:13px;border-bottom:1px solid #eef2f7}
.bh-t tr:last-child td{border-bottom:0}
.bh-src{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;white-space:nowrap}
.bh-src.m{background:#dcfce7;color:#166534}
.bh-src.b{background:#f1f5f9;color:#475569}
.bh-in{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;max-width:110px;box-sizing:border-box}
.bh-in:focus{outline:0;border-color:var(--accent)}
.bh-in.err{border-color:var(--danger);background:#fef2f2}
.bh-in.dirty{border-color:var(--warn);background:#fffbeb}
.dg-qty{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font:inherit;font-size:13px;max-width:90px;text-align:center;box-sizing:border-box}
.dg-qty:focus{outline:0;border-color:var(--accent)}
.dg-qty.dirty{border-color:var(--warn);background:#fffbeb}
.dg-qty.err{border-color:var(--danger);background:#fef2f2}
.chk{list-style:none;padding:0;margin:0 0 14px}
.chk li{padding:7px 0;font-size:13px;border-bottom:1px solid #eef2f7;display:flex;gap:9px;align-items:flex-start}
.chk li:last-child{border-bottom:0}
.chk .m{font-weight:800;min-width:16px}
.chk .yes{color:#166534}.chk .no{color:#991b1b}
.appr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.appr-kv{font-size:13px;color:var(--muted)}
.appr-kv b{display:block;color:var(--ink);font-size:15px;margin-top:3px;font-weight:800}
@media(max-width:1100px){.appr-grid{grid-template-columns:repeat(2,1fr)}}
.invrow .srcinner{padding:10px 12px}
.runmeta{font-size:12px;color:var(--muted);margin-top:10px;direction:ltr;text-align:start;font-family:monospace}
@media(max-width:1100px){.res-grid{grid-template-columns:repeat(2,1fr)}}
.repnote{padding:12px 14px;background:#fffbeb;border-inline-start:4px solid var(--warn);border-radius:8px;color:#92400e;margin-bottom:14px;font-size:13px}
@media(max-width:1100px){.sum-grid{grid-template-columns:repeat(2,1fr)}.months-grid{grid-template-columns:repeat(4,minmax(88px,1fr))}}
@media(max-width:750px){.months-grid{grid-template-columns:repeat(3,minmax(84px,1fr))}}

@media(max-width:750px){.frm{grid-template-columns:1fr}}



/* ============================================================================
   PRINT — A4. Everything here lives inside @media print, so the on-screen
   layout is byte-for-byte unchanged. Chrome/Edge "Save as PDF" in the same
   dialog is what the PDF button opens; there is no separate PDF generator.
   ========================================================================== */
@media print{
  @page{ size:A4; margin:14mm 12mm; }
  html,body{ background:#fff !important; color:#000 !important; }
  .sidebar,.nav,#langsw,.topbar .actions,
  #ghsBootGate,#ghsPersistWarn,#ghsRunsWarn,
  .btn,button,select,input,.rowacts,.dist-f .rowacts,
  #bhTestPanel,#ivTestPanel,#aeTestPanel,#brTestPanel,#qtTestPanel,#miTestPanel,
  .srcbtn,.chip,.mi-in{ display:none !important; }
  .page.hidden{ display:none !important; }
  .main,.content,.wrap{ margin:0 !important; padding:0 !important; width:100% !important; }
  .panel{ box-shadow:none !important; border:1px solid #999 !important;
          break-inside:avoid; page-break-inside:avoid; margin:0 0 8mm 0 !important; }
  .table-wrap{ overflow:visible !important; max-height:none !important; }
  table{ width:100% !important; border-collapse:collapse !important; font-size:10pt !important; }
  thead{ display:table-header-group; }            /* repeat headings on every page */
  tfoot{ display:table-footer-group; }
  tr,td,th{ break-inside:avoid; page-break-inside:avoid; }
  th,td{ border:1px solid #999 !important; padding:3pt 4pt !important; color:#000 !important; }
  th{ background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .total-row td{ font-weight:700 !important; background:#f2f2f2 !important;
                 -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pill,.sub-id{ border:1px solid #999 !important; background:transparent !important; color:#000 !important; }
  .repnote,.runmeta,.unconstrained{ color:#333 !important; }
  a[href]:after{ content:'' !important; }         /* no URL noise in the margin */
  .print-only{ display:block !important; }
}
.print-only{ display:none; }
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo">GE</div><div><b>GHIS EXP</b><small>نظام المصروفات</small></div></div>
    <nav class="nav">
      <button data-page="types" class="active">\ud83d\udcc2 أنواع المصروفات</button>
    </nav>
    <div class="sidefoot"><span class="pill neutral" id="sfPill">—</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="pgTitle">أنواع المصروفات</h1><p id="pgSub">—</p></div>

      </div>

          <div class="rep-f"><label class="lbl" id="itLSearch">بحث</label>
            <input class="field" id="itSearch" placeholder="اسم البند أو كوده"></div>

        </div>
        <div class="table-wrap"><table>

        <div class="runmeta" id="itMeta"></div>
      </div>
    </section>

<script src="data.js"></script>
<script>
/* ============================================================================
   GHS EXP — clean shell after the reset.

   This page shows exactly two things: the expense types, and the items that
   belong to the one you click. Nothing else. There is no budget, no price, no
   quantity, no limit, no invoice, no run, no report and no date anywhere,
   because none of that data exists any more.

   engine.js, Code.gs, the persistence module and every test file are untouched
   on disk; this shell simply does not load or drive them. The previous UI is
   preserved whole in index-legacy-full.html.
   ========================================================================== */
(function(){
'use strict';

const TYPE_ICON={ET001:'\ud83c\udfad',ET002:'\u26bd',ET003:'\ud83c\udfa8',ET004:'\u270f\ufe0f',
  ET005:'\ud83c\udf31',ET006:'\ud83d\udd27',ET007:'\ud83d\udcda',ET008:'\ud83d\udda8\ufe0f',
  ET009:'\ud83e\uddf9',ET010:'\ud83d\udccb'};

var D = window.GHS_DATA || {types:[],items:[]};
var LANG = 'ar';
var openType = null;

function T(ar,en){ return LANG==='en' ? en : ar; }
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }

function types(){ return (D.types||[]).slice(); }
function itemsOf(typeId){ return (D.items||[]).filter(function(x){ return x.t===typeId; }); }
function icon(id){ return TYPE_ICON[id] || '\ud83d\udce6'; }

/* one card shape, one icon per type_id — reused by every future screen */
function typeCard(t){
  return '<button class="type" data-ty="'+esc(t.id)+'">'+
         '<div class="icon">'+icon(t.id)+'</div>'+
         '<h3>'+esc(t.n)+'</h3></button>';
}
window.GHS_TYPECARD={ html:typeCard, icon:icon };

function renderCards(){
  var host=el('tyCards'); if(!host) return;
  var ts=types();
  host.innerHTML=ts.map(typeCard).join('');
  Array.prototype.forEach.call(host.querySelectorAll('[data-ty]'),function(b){
    b.onclick=function(){ open(b.getAttribute('data-ty')); };
  });
  el('tyPill').textContent=ts.length+' '+T('نوع','types');
  el('sfPill').textContent=ts.length+' '+T('نوع','types')+'  ·  '+
    (D.items||[]).length+' '+T('بند','items');
  el('tyNote').textContent=T(
    'اضغط على نوع المصروف لعرض البنود التابعة له. النظام لا يحتوي حاليًا على أي أسعار أو كميات أو حدود أو موازنات — سيتم تحديد طريقة التشغيل الجديدة لاحقًا.',
    'Click an expense type to list the items that belong to it. The system currently holds no prices, quantities, limits or budgets — the new operating flow will be defined later.');
}

function open(typeId){
  openType=typeId;
  el('itPanel').classList.remove('hidden');
  el('itSearch').value='';
  paint();
}
function paint(){
  if(!openType) return;
  var t=types().filter(function(x){ return x.id===openType; })[0]||{n:openType};
  var q=String(el('itSearch').value||'').trim().toLowerCase();
  var rows=itemsOf(openType).filter(function(x){
    if(!q) return true;
    return String(x.n||'').toLowerCase().indexOf(q)>-1 ||
           String(x.i||'').toLowerCase().indexOf(q)>-1;
  });
  el('itPill').textContent=icon(openType)+'  '+t.n+'  ·  '+rows.length+' '+T('بند','items');
  el('itRows').innerHTML = rows.length
    ? rows.map(function(x){
        return '<tr><td><span class="sub-id" style="margin:0">'+esc(x.i)+'</span></td>'+
               '<td style="white-space:normal">'+esc(x.n)+'</td></tr>'; }).join('')
    : '<tr><td colspan="2" class="unconstrained" style="text-align:center;padding:24px">'+
      esc(T('لا توجد بنود مطابقة','No matching items'))+'</td></tr>';
  el('itMeta').textContent=T('الكود والاسم فقط — لا توجد بيانات تشغيلية في هذه المرحلة.',
    'Code and name only — there is no operational data at this stage.');
}

function labels(){
  [['pgTitle','أنواع المصروفات','Expense types'],
   ['pgSub','اختر نوع مصروف لعرض بنوده','Pick an expense type to list its items'],
   ['tyTitle','أنواع المصروفات','Expense types'],
   ['itTitle','البنود','Items'],
   ['itLSearch','بحث','Search'],
   ['itClose','رجوع','Back'],
   ['itC1','كود البند','Item code'],
   ['itC2','اسم البند','Item name']
  ].forEach(function(x){ var e=el(x[0]); if(e) e.textContent=T(x[1],x[2]); });
  var s=el('itSearch');
  if(s) s.placeholder=T('اسم البند أو كوده','Item name or code');
}
function render(){ labels(); renderCards(); if(openType) paint(); }

/* ---- wiring ---- */
el('itSearch').oninput=paint;
el('itClose').onclick=function(){ openType=null; el('itPanel').classList.add('hidden'); };
Array.prototype.forEach.call(document.querySelectorAll('#langsw button'),function(b){
  b.onclick=function(){
    LANG=b.getAttribute('data-lang');
    document.documentElement.setAttribute('dir', LANG==='en'?'ltr':'rtl');
    document.documentElement.setAttribute('lang', LANG);
    Array.prototype.forEach.call(document.querySelectorAll('#langsw button'),function(o){
      o.classList.toggle('on', o===b); });
    render();
  };
});

render();
window.GHS_SHELL={ render:render, open:open, types:types, itemsOf:itemsOf,
  icon:icon, lang:function(){ return LANG; }, openType:function(){ return openType; } };
})();
</script>
