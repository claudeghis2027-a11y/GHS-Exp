/* ============================================================================
   PRINT / PDF — screen rendering is untouched.

   Every rule here is inside @media print, so the approved stylesheet above
   stays exactly as it was and the application looks identical on screen.
   When a PDF is asked for, one invoice is rendered into #printRoot and the
   rest of the document is hidden, which is what keeps one invoice's figures
   from leaking into another invoice's file.
   ========================================================================== */

  @page{size:A4;margin:14mm}

<script>
/* ============================================================================
   FAIL-SAFE BOOT — runs before everything else.

   #login and #app both start hidden so a returning session does not flash the
   sign-in box. That means a blank page is the visible result of ANY failure in
   the main script: a stale cached build, a blocked data.js, one bad byte.

   This block removes that whole class of failure. It reads the token from
   localStorage synchronously — no network — and shows the sign-in screen right
   away when there is none. It also watches for an error during start-up and, if
   one happens, reveals the sign-in screen and says what went wrong instead of
   leaving a white void with no clue.
   ========================================================================== */
(function(){
  var shown=false;
  function reveal(){
    if(shown) return; shown=true;
    var l=document.getElementById('login');
    if(l) l.classList.remove('hidden');
  }
  var token=null;
  try{ token=window.localStorage.getItem('ghis_exp_token'); }catch(e){}
  /* no stored session: nothing to restore, so show the sign-in screen at once */
  if(!token) reveal();

  window.addEventListener('error',function(ev){
    var app=document.getElementById('app');
    if(app && !app.classList.contains('hidden')) return;   /* app is already up */
    reveal();
    var box=document.getElementById('le');
    if(box) box.textContent='تعذّر تحميل التطبيق. اضغط Ctrl+Shift+R لتحديث النسخة المخزَّنة.';
  });
  /* if the application has not shown itself within four seconds, something is
     wrong; show the sign-in screen rather than an empty page */
  setTimeout(function(){
    var app=document.getElementById('app');
    if(app && app.classList.contains('hidden')) reveal();
  },4000);

  /* A service worker from an older build can keep serving a broken copy of this
     page for ever, because the worker only updates when a navigation reaches
     the network — and a broken cached page may never let one through.

     This page carries its own build stamp. If the document that actually
     rendered is not the build this script belongs to, every worker is torn
     down and the page reloaded once, from the network. The one-shot flag stops
     that from ever becoming a loop. */
  var BUILD='2026-09-14-failsafe';
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ try{ r.update(); }catch(e){} });
    }).catch(function(){});

    window.addEventListener('load',function(){
      setTimeout(function(){
        var app=document.getElementById('app');
        var stillBlank = !document.body || document.body.innerText.trim().length===0;
        var neverStarted = app && app.classList.contains('hidden') &&
                           document.getElementById('login').classList.contains('hidden');
        if(!(stillBlank||neverStarted)) return;
        var once='ghis_sw_reset';
        try{ if(window.sessionStorage.getItem(once)) return;
             window.sessionStorage.setItem(once,BUILD); }catch(e){ return; }
        navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); }));
        }).then(function(){
          if(window.caches&&caches.keys)
            return caches.keys().then(function(k){
              return Promise.all(k.map(function(n){ return caches.delete(n); })); });
        }).then(function(){ window.location.reload(); })
         .catch(function(){});
      },3000);
    });
  }
})();
</script>

<script>
/* ============================================================================
   GHIS EXP — production frontend.

   The markup, the stylesheet and the whole rendering vocabulary are the
   approved prototype's, unchanged: one #content div, page functions that
   return HTML, wire() binding afterwards, the same .panel / .cards / .type /
   .table / .stat / .toolbar / .modal classes.

   What is replaced is the data layer underneath. The prototype kept its state
   in localStorage; this talks to the Apps Script backend over a session token
   and lets the server decide every financial rule. The only thing kept in the
   browser is that token — never a password, never a role the server has not
   confirmed, never the operational data itself.
   ========================================================================== */
(function(){
'use strict';

var API_URL='https://script.google.com/macros/s/AKfycbyrazoTuTjKkezqOdXFJP7Op-ihRyV_y7nxptD1PZa8Y_rPWG9EvqZixbQSMeDp46CE/exec';
var TOKEN_KEY='ghis_exp_token';

var TOKEN=null, USER=null;
var page='home', type=null, month=0, report=null;
var S={ types:[], items:[], units:[], fy:[], currentFy:null,
        prices:{}, limits:{}, annual:{}, monthly:{},
        invoices:[], executions:[], users:[], vat:0.14,
        fyStartMonth:'سبتمبر', fyEndMonth:'أغسطس' };
var GREG=['يناير','فبراير','مارس','أبريل','مايو','يونيو',
          'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var TYPE_ICON={ET001:'🎭',ET002:'⚽',ET003:'🎨',ET004:'✏️',ET005:'🌱',
  ET006:'🔧',ET007:'📚',ET008:'🖨️',ET009:'🧹',ET010:'📋'};
var M=['سبتمبر','أكتوبر','نوفمبر','ديسمبر','يناير','فبراير',
       'مارس','أبريل','مايو','يونيو','يوليو','أغسطس'];
var UNITS=['لتر','مل','وحدة','قطعة','علبة','كرتونة','عدد','كجم','جرام','طن',
           'متر','سنتيمتر','عبوة','زجاجة','جالون','رول','باكو','دستة'];

/* ---------- the one place the browser talks to the server ---------- */
function api(action,payload){
  var body=payload||{}; body.action=action;
  if(TOKEN) body.token=TOKEN;
  if(typeof fetch!=='function') return Promise.reject(new Error('FETCH_UNAVAILABLE'));
  return fetch(API_URL,{method:'POST',body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(j){
      /* a session the server no longer honours is dropped here, once */
      if(j&&j.ok===false&&j.error==='INVALID_SESSION') clearSession();
      return j;
    });
}
var ERR={
  INVALID_CREDENTIALS:'اسم المستخدم أو كلمة المرور غير صحيحة',
  ACCOUNT_DISABLED:'هذا الحساب معطَّل',
  INVALID_SESSION:'انتهت الجلسة — سجّل الدخول من جديد',
  FORBIDDEN:'هذا الإجراء للمشرف فقط',
  INVALID_FY:'السنة المالية غير صالحة', FY_CLOSED:'السنة المالية مقفلة',
  ALREADY_EXISTS:'موجود بالفعل', INVALID_YEAR:'سنة غير صالحة',
  UNIT_REQUIRED:'الوحدة مطلوبة', INVALID_PRICE:'سعر غير صالح',
  INVALID_MONTHLY_MAX:'حد شهري غير صالح', INVALID_ANNUAL_MAX:'حد سنوي غير صالح',
  MONTHLY_ABOVE_ANNUAL:'الحد الأقصى الشهري أكبر من السنوي',
  ANNUAL_MAX_BELOW_EXECUTED:'الحد السنوي أقل مما نُفِّذ بالفعل',
  MONTHLY_EXCEEDS_ANNUAL:'مجموع الشهور يتجاوز الموازنة السنوية',
  NO_MONTHLY_BUDGET:'لا توجد موازنة لهذا الشهر',
  NET_DOES_NOT_MATCH_BUDGET:'الصافي لا يطابق موازنة الشهر',
  EXCEEDS_MONTHLY_MAX:'يتجاوز الحد الأقصى الشهري',
  EXCEEDS_ANNUAL_MAX:'يتجاوز الحد الأقصى السنوي',
  DISCOUNT_EXCEEDS_UNIT_PRICE:'الخصم يساوي وحدة كاملة — ليس تسوية',
  NOT_APPROVED:'لا تُحفظ إلا العمليات المعتمدة',
  DUPLICATE_RUN:'هذه العملية محفوظة بالفعل',
  ITEM_NOT_PRICED:'صنف بلا سعر محفوظ',
  PRICE_MISMATCH:'السعر لا يطابق المحفوظ على الخادم',
  INVALID_QUANTITY:'كمية غير صالحة', REASON_REQUIRED:'اذكر سبب التعديل',
  PASSWORD_TOO_SHORT:'كلمة المرور قصيرة (8 أحرف على الأقل)',
  USERNAME_REQUIRED:'اسم المستخدم مطلوب', BAD_ROLE:'دور غير صالح',
  SERVER_ERROR:'تعذر إتمام العملية على الخادم'
};
function emsg(r){ return (r&&ERR[r.error])||'تعذر إتمام العملية'; }
function offline(){ return 'تعذر الوصول إلى الخادم — تحقق من الاتصال ثم أعد المحاولة.'; }

/* ---------- the session, and only the session, is remembered ---------- */
function storeToken(t){
  TOKEN=t;
  try{ window.localStorage.setItem(TOKEN_KEY,t); }catch(e){}
}
function readToken(){
  try{ return window.localStorage.getItem(TOKEN_KEY); }catch(e){ return null; }
}
function clearSession(){
  TOKEN=null; USER=null;
  try{ window.localStorage.removeItem(TOKEN_KEY); }catch(e){}
}

/* ---------- helpers, identical in behaviour to the prototype's ---------- */
function adm(){ return !!USER && USER.role==='ADMIN'; }
function fy(){ return S.currentFy; }
function fyLabel(){ return S.currentFy?(S.currentFy+'/'+(S.currentFy+1)):'—'; }
function money(n){
  n=Number(n)||0;
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function items(t){ return S.items.filter(function(i){ return i.t===t; }); }
function typeBy(id){ return S.types.filter(function(t){ return t.id===id; })[0]||{n:id,icon:'📦'}; }
function icon(id){ return TYPE_ICON[id]||'📦'; }
function el(id){ return document.getElementById(id); }
function r2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }
function num(v){ if(v===''||v==null) return null; var n=Number(v); return isNaN(n)?null:n; }

function priceOf(id){ return S.prices[id]||null; }
function limitOf(id){ return S.limits[id]||null; }
function annual(t){ var a=S.annual[t]; return a?a.amount:0; }
function annualRec(t){ return S.annual[t]||null; }
function mb(t,m){ var a=S.monthly[t]; return (a&&a[m]!=null)?Number(a[m]):0; }
function months(t){ return S.monthly[t]||[null,null,null,null,null,null,null,null,null,null,null,null]; }
function executedQty(id,upto){
  var q=0;
  S.executions.forEach(function(e){
    if(e.itemId!==id) return;
    if(upto!=null&&e.month>upto) return;
    q+=Number(e.quantity)||0; });
  return q;
}
function executedAmount(t,m){
  var a=0;
  S.invoices.forEach(function(v){
    if(v.typeId!==t) return;
    if(m!=null&&v.month!==m) return;
    a+=Number(v.net)||0; });
  return r2(a);
}

/* ============================================================================
   QUANTITY DISTRIBUTION — the production engine, unchanged in behaviour.
   engine.js (DE-1.2.1) stays frozen and is not called from here.

   Ceilings first, whole units only, least-used items first so the year
   spreads, one filler unit if a gap remains, and only then the smallest
   discount that closes the amount exactly. A discount never buys a unit a
   ceiling forbids.
   ========================================================================== */
function headroom(id,m){
  var l=limitOf(id)||{};
  if(l.monthlyMax==null&&l.annualMax==null) return null;
  var usedM=0,usedY=0;
  S.executions.forEach(function(e){
    if(e.itemId!==id) return;
    usedY+=Number(e.quantity)||0;
    if(e.month===m) usedM+=Number(e.quantity)||0; });
  var byM=l.monthlyMax==null?Infinity:Math.max(0,l.monthlyMax-usedM);
  var byY=l.annualMax==null?Infinity:Math.max(0,l.annualMax-usedY);
  var r=Math.min(byM,byY);
  return r===Infinity?null:r;
}
function eligible(t,m){
  var out=[],skipped=[];
  items(t).forEach(function(x){
    var p=priceOf(x.id);
    if(!p||p.price==null||!(Number(p.price)>0)){ skipped.push({id:x.id,why:'NO_PRICE'}); return; }
    if(!p.unit){ skipped.push({id:x.id,why:'NO_UNIT'}); return; }
    var room=headroom(x.id,m);
    if(room===null){ skipped.push({id:x.id,why:'NO_LIMIT'}); return; }
    if(room<=0){ skipped.push({id:x.id,why:'NO_HEADROOM'}); return; }
    out.push({id:x.id,name:x.n,unit:p.unit,price:Number(p.price),
              room:room,usedYear:executedQty(x.id)});
  });
  return {eligible:out,skipped:skipped};
}
/* Shares the priced lines across `want` invoices, aiming at an equal value per
   invoice. Quantities are only ever moved as whole units, so an item priced at
   250 contributes 250 at a time; an invoice is filled until adding another unit
   would take it past its target, then the next one starts. Any remainder lands
   on the last invoice, so the totals always add back up to the run. */
function splitIntoInvoices(lines,want){
  var n=Math.max(1,Math.floor(Number(want)||1));
  var totalUnits=lines.reduce(function(a,l){ return a+l.quantity; },0);
  if(n>totalUnits) n=totalUnits;            /* cannot split a unit in half */
  if(n<=1) return [{seq:1,lines:lines.map(function(l){
    return {id:l.id,name:l.name,unit:l.unit,price:l.price,quantity:l.quantity}; })}];

  var grand=lines.reduce(function(a,l){ return a+l.price*l.quantity; },0);
  var target=grand/n;

  /* one entry per unit, cheapest item first so the fill is smooth */
  var queue=[];
  lines.slice().sort(function(a,b){ return a.price-b.price; })
    .forEach(function(l){
      for(var q=0;q<l.quantity;q++)
        queue.push({id:l.id,name:l.name,unit:l.unit,price:l.price});
    });

  var invs=[],cur=null,curVal=0,made=0;
  function open(){ cur={seq:made+1,lines:[],_ix:{}}; invs.push(cur); made++; curVal=0; }
  open();
  for(var i=0;i<queue.length;i++){
    var u=queue[i];
    var unitsLeft=queue.length-i;
    var invoicesLeft=n-made;
    /* move on when this invoice has had its share, but never leave a later
       invoice with nothing to put in it */
    if(invoicesLeft>0 && curVal>0 && curVal+u.price>target+0.004 &&
       unitsLeft>invoicesLeft) open();
    else if(invoicesLeft>0 && unitsLeft===invoicesLeft && curVal>0) open();
    if(cur._ix[u.id]==null){
      cur._ix[u.id]=cur.lines.length;
      cur.lines.push({id:u.id,name:u.name,unit:u.unit,price:u.price,quantity:0});
    }
    cur.lines[cur._ix[u.id]].quantity++;
    curVal=r2(curVal+u.price);
  }
  invs.forEach(function(x){ delete x._ix; });
  invs=invs.filter(function(x){ return x.lines.length; });
  invs.forEach(function(x,i){ x.seq=i+1; });
  return invs;
}
function distribute(t,m,invoiceCount){
  var budget=mb(t,m);
  if(!(budget>0)) return {ok:false,reason:'NO_MONTHLY_BUDGET'};
  var n=Number(invoiceCount)||0;
  if(n<1||n!==Math.floor(n)) return {ok:false,reason:'BAD_INVOICE_COUNT'};
  var pool=eligible(t,m);
  if(!pool.eligible.length) return {ok:false,reason:'NO_ELIGIBLE_ITEMS',skipped:pool.skipped};

  var ordered=pool.eligible.slice().sort(function(a,b){
    if(a.usedYear!==b.usedYear) return a.usedYear-b.usedYear;
    return a.price-b.price; });
  var picked={},spent=0,guard=0,progress=true;
  while(progress&&spent<budget&&guard<200000){
    progress=false;
    for(var k=0;k<ordered.length;k++){
      guard++;
      var it=ordered[k];
      var have=picked[it.id]?picked[it.id].quantity:0;
      if(have>=it.room) continue;
      if(spent+it.price>budget+1e-7) continue;
      if(!picked[it.id]) picked[it.id]={id:it.id,name:it.name,unit:it.unit,price:it.price,quantity:0};
      picked[it.id].quantity++;
      spent=r2(spent+it.price);
      progress=true;
      if(spent>=budget) break;
    }
  }
  var lines=Object.keys(picked).map(function(k){ return picked[k]; });
  if(!lines.length) return {ok:false,reason:'BUDGET_TOO_SMALL',cheapest:ordered[0].price};

  var gap=r2(budget-spent), discount=0, filler=null;
  if(gap>0.004){
    var cand=null;
    for(var q=0;q<ordered.length;q++){
      var c=ordered[q];
      var hv=picked[c.id]?picked[c.id].quantity:0;
      if(hv>=c.room) continue;
      if(c.price<=gap+1e-7) continue;
      if(!cand||c.price<cand.price) cand=c;
    }
    if(cand){
      if(!picked[cand.id]) picked[cand.id]={id:cand.id,name:cand.name,unit:cand.unit,price:cand.price,quantity:0};
      picked[cand.id].quantity++;
      spent=r2(spent+cand.price);
      filler=cand.id;
      lines=Object.keys(picked).map(function(k){ return picked[k]; });
    }
    discount=r2(spent-budget);
    if(discount<0) discount=0;
  }
  var gross=r2(lines.reduce(function(a,l){ return a+l.price*l.quantity; },0));
  var net=r2(gross-discount);
  var before=r2(net/(1+S.vat)), tax=r2(net-before);
  /* Split across the requested number of invoices by VALUE, not by item.
     Handing each distinct item to a different invoice caps the count at the
     number of items, so asking for five invoices of two items produced two.
     Here every invoice gets a share of the total, and a single item's quantity
     is broken across invoices when that is what it takes to fill them. Units
     stay whole, and no invoice is created empty or duplicated. */
  var invs=splitIntoInvoices(lines,n);
  return {ok:true,typeId:t,month:m,budget:r2(budget),lines:lines,invoices:invs,
    requestedInvoices:Number(invoiceCount)||1,
    gross:gross,discount:discount,net:net,tax:tax,before:before,
    difference:r2(net-budget),filler:filler,skipped:pool.skipped,
    itemCount:lines.length,unitCount:lines.reduce(function(a,l){ return a+l.quantity; },0)};
}

/* ============================================================================
   LOADING — one round trip per screen, as the backend's bootstrap provides
   ========================================================================== */
function applyBoot(r){
  if(r.settings&&r.settings.vat_rate!=null){
    var v=Number(r.settings.vat_rate); if(!isNaN(v)) S.vat=v;
  }
  /* the end month is the month before the start, wrapping round the year —
     derived, so the two can never contradict each other */
  if(r.settings&&r.settings.fiscal_start_month!=null){
    var sm=Number(r.settings.fiscal_start_month);
    if(sm>=1&&sm<=12){
      S.fyStartMonth=GREG[sm-1];
      S.fyEndMonth=GREG[(sm+10)%12];
    }
  }
  S.fy=(r.fiscalYears||[]).map(function(f){ return f.startYear; }).sort(function(a,b){ return a-b; });
  if(S.currentFy&&S.fy.indexOf(S.currentFy)<0) S.currentFy=null;
  if(!S.currentFy&&S.fy.length) S.currentFy=S.fy[0];
  (r.types||[]).forEach(function(t){
    if(!S.types.some(function(x){ return x.id===t.id; }))
      S.types.push({id:t.id,n:t.n,icon:icon(t.id)});
  });
  /* The year-scoped half of the response is only present when the request
     named a year. Clearing it on a reply that carries no year would blank the
     screen while the sheet still holds the data — which is exactly how a
     refresh appeared to lose everything. */
  if(!r.fyId) return;
  S.prices={}; S.limits={};
  (r.prices||[]).forEach(function(p){
    S.prices[p.itemId]={unit:p.unit,price:p.price};
    S.limits[p.itemId]={monthlyMax:p.monthlyMax,annualMax:p.annualMax};
  });
  S.annual={}; S.monthly={};
  (r.budgets||[]).forEach(function(b){
    if(b.annual!=null) S.annual[b.typeId]={amount:b.annual,locked:true,when:b.updatedAt||''};
    S.monthly[b.typeId]=(b.months||[]).slice();
  });
  S.executions=(r.executions||[]).map(function(e){
    return {itemId:e.itemId,month:e.month,quantity:e.quantity,
            price:e.unitPrice,by:e.approvedBy,when:e.approvedAt}; });
  S.invoices=(r.invoices||[]).map(function(v){
    return {id:v.invoiceId,typeId:v.typeId,month:v.month,lines:v.lines||[],
            gross:v.gross,tax:v.vat,discount:v.discount,net:v.net,
            approvedBy:v.approvedBy,approvedAt:v.approvedAt,
            status:v.status,edits:v.edits||[]}; });
}
function reload(){
  /* On a refresh S.currentFy starts empty, so the first call cannot name a
     year and the server rightly returns none of the year-scoped data. Asking
     once more, now that the year list has arrived, is what makes a reload show
     the same figures the sheet holds. */
  return api('bootstrap',{fyId:S.currentFy?('FY'+S.currentFy):''})
    .then(function(r){
      if(!r||r.ok!==true) return r;
      applyBoot(r);
      if(S.currentFy && r.fyId!==('FY'+S.currentFy))
        return api('bootstrap',{fyId:'FY'+S.currentFy}).then(function(r2){
          if(r2&&r2.ok===true) applyBoot(r2);
          return r2||r;
        });
      return r;
    });
}

/* ============================================================================
   PDF — the browser's own print engine, one invoice at a time.

   No library is loaded. The browser already shapes Arabic correctly and
   handles right-to-left, which is precisely what a PDF library would have to
   reimplement. The invoice is rendered into #printRoot, everything else is
   hidden by the print stylesheet, and the document title becomes the
   suggested filename.
   ========================================================================== */
function pdfFileName(v){
  /* فاتورة-نظافة-FY2026-01-001 — readable, and unique per invoice */
  var typeName=String(typeBy(v.typeId).n||v.typeId).replace(/[\\/\\\\:*?"<>|]/g,'').replace(/\s+/g,'-');
  var seq=(String(v.id).match(/-(\d{3})$/)||[])[1]||'001';
  return 'فاتورة-'+typeName+'-FY'+fy()+'-'+('0'+(v.month+1)).slice(-2)+'-'+seq;
}
function pdfHtml(v){
  var rows=v.lines.map(function(l){
    var g=r2(l.price*l.quantity);
    var share=v.gross>0?r2(v.discount*(g/v.gross)):0;
    var before=r2(g/(1+S.vat));
    return '<tr><td>'+esc(l.itemName)+'</td>'+
      '<td>'+esc(l.unit||'—')+'</td>'+
      '<td class="num">'+money(l.price)+'</td>'+
      '<td class="num">'+l.quantity+'</td>'+
      '<td class="num">'+money(g)+'</td>'+
      '<td class="num">'+money(r2(g-before))+'</td>'+
      '<td class="num">'+money(share)+'</td>'+
      '<td class="num">'+money(r2(g-share))+'</td></tr>';
  }).join('');
  var approved=String(v.approvedAt||'').slice(0,16).replace('T',' ');
  return ''+
  '<div class="pdf-head">'+
    '<div class="pdf-brand"><div class="pdf-logo">GE</div>'+
      '<div><b>GHIS EXP</b><small>نظام إدارة المصروفات</small></div></div>'+
    '<div class="pdf-no">رقم الفاتورة<b>'+esc(v.id)+'</b>'+
      'تاريخ الفاتورة: '+esc(approved||'—')+'</div>'+
  '</div>'+
  '<div class="pdf-meta">'+
    '<div><small>نوع المصروف</small><b>'+esc(typeBy(v.typeId).n)+'</b></div>'+
    '<div><small>السنة المالية</small><b>'+esc(fyLabel())+'</b></div>'+
    '<div><small>الشهر</small><b>'+esc(M[v.month])+'</b></div>'+
    '<div><small>الحالة</small><b>'+(v.status==='APPROVED'?'معتمدة':esc(v.status))+'</b></div>'+
  '</div>'+
  '<table><thead><tr><th>البند</th><th>الوحدة</th><th>سعر الوحدة</th><th>الكمية</th>'+
    '<th>إجمالي البند</th><th>الضريبة</th><th>الخصم المسموح به</th>'+
    '<th>صافي المبلغ</th></tr></thead><tbody>'+rows+'</tbody></table>'+
  '<div class="pdf-tot"><table>'+
    '<tr><td>إجمالي الفاتورة</td><td class="num">'+money(v.gross)+'</td></tr>'+
    '<tr><td>الضريبة المضمَّنة</td><td class="num">'+money(v.tax)+'</td></tr>'+
    '<tr><td>الخصم المسموح به</td><td class="num">'+money(v.discount)+'</td></tr>'+
    '<tr class="net"><td>صافي المبلغ</td><td class="num">'+money(v.net)+'</td></tr>'+
  '</table></div>'+
  ((v.edits&&v.edits.length)?('<div class="pdf-edits"><b>تعديلات مسجَّلة:</b><br>'+
    v.edits.map(function(e){
      return esc(String(e.at||'').slice(0,16).replace('T',' ')+' · '+e.by+' · '+
        e.itemId+': '+e.oldValue+' → '+e.newValue+' · '+e.reason); }).join('<br>')+
    '</div>'):'')+
  '<div class="pdf-foot">'+
    '<span>'+(v.approvedBy?('اعتمدها: '+esc(v.approvedBy)+(approved?('  ·  '+esc(approved)):'')):'—')+'</span>'+
    '<span>'+esc(fyLabel())+'  ·  '+esc(M[v.month])+'</span>'+
  '</div>';
}
/* Renders exactly one invoice, prints, then clears — so nothing from a
   previous invoice can survive into the next file. */
function downloadPdf(invoiceId){
  var v=S.invoices.filter(function(x){ return x.id===invoiceId; })[0];
  if(!v) return;
  var root=el('printRoot');
  root.innerHTML=pdfHtml(v);
  var oldTitle=document.title;
  document.title=pdfFileName(v);        /* the browser offers this as the filename */
  function done(){
    document.title=oldTitle;
    root.innerHTML='';
    if(window.removeEventListener) window.removeEventListener('afterprint',done);
  }
  if(window.addEventListener) window.addEventListener('afterprint',done);
  window.print();
  /* a fallback for browsers that do not fire afterprint */
  setTimeout(done,1500);
}

function reportData(kind){
  if(kind==='item'){
    var head=['الصنف'].concat(M).concat(['الإجمالي']);
    var body=[];
    S.items.forEach(function(x){
      var row=[x.n],tot=0,any=false;
      for(var m=0;m<12;m++){
        var amt=0;
        S.invoices.forEach(function(v){
          if(v.month!==m) return;
          v.lines.forEach(function(l){ if(l.itemId===x.id) amt+=r2(l.price*l.quantity); });
        });
        if(amt) any=true;
        tot+=amt; row.push(amt?r2(amt):'');
      }
      row.push(r2(tot));
      if(any) body.push(row);
    });
    return {title:'تنفيذ البنود شهريًا',head:head,body:body};
  }
  if(kind==='budget'){
    return {title:'إجمالي الموازنة',
      head:['نوع المصروف','موازنة الشهر','الموازنة السنوية','المنفَّذ','المتبقي'],
      body:S.types.map(function(t){
        var ex=0; for(var m=0;m<12;m++) ex+=executedAmount(t.id,m);
        return [t.n,mb(t.id,month),annual(t.id),r2(ex),r2(annual(t.id)-ex)];
      })};
  }
  if(kind==='qty'){
    var t0=type||(S.types[0]||{}).id;
    return {title:'الكميات والأسعار — '+esc(typeBy(t0).n),
      head:['الصنف','الوحدة','سعر الوحدة','الحد الأقصى الشهري','الحد الأقصى السنوي','المنفَّذ','المتبقي'],
      body:items(t0).map(function(i){
        var p=priceOf(i.id)||{},l=limitOf(i.id)||{};
        var ex=executedQty(i.id,month);
        return [i.n,p.unit||'—',p.price==null?'—':p.price,
          l.monthlyMax==null?'—':String(l.monthlyMax),
          l.annualMax==null?'—':String(l.annualMax),
          String(ex), l.annualMax==null?'—':String(l.annualMax-ex)];
      })};
  }
  return {title:'تنفيذ المبالغ',
    head:['نوع المصروف'].concat(M).concat(['إجمالي المنفَّذ','إجمالي الموازنة','المتبقي']),
    body:S.types.map(function(t){
      var row=[t.n],tot=0;
      for(var m=0;m<12;m++){ var a=executedAmount(t.id,m); tot+=a; row.push(a?a:''); }
      row.push(r2(tot)); row.push(annual(t.id)); row.push(r2(annual(t.id)-tot));
      return row;
    })};
}

/* ============================================================================

var NAMES={home:'الرئيسية',settings:'إعدادات النظام',types:'أنواع المصروفات',
  prices:'الأسعار والكميات',budgets:'توزيع الميزانيات شهريًا',
  distribution:'توزيع الكميات',invoices:'طباعة الفواتير',reports:'التقارير',
  users:'المستخدمين'};
var VIEWS={home:home,settings:settings,types:types,prices:prices,budgets:budgets,
  distribution:distribution,invoices:invoices,reports:reports,users:users};

function go(p){ if(!VIEWS[p]) return; page=p; type=null; runResult=null; report=null; render(); }
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){
    b.classList.toggle('active', b.getAttribute('data-p')===page); });
  el('title').textContent=NAMES[page]+(fy()?('  ·  '+fyLabel()):'');
  el('who').textContent=USER?(USER.username+' ('+(USER.role==='ADMIN'?'مشرف':'مستخدم')+')'):'—';
  el('content').innerHTML=VIEWS[page]();
  wire();
}
function msg(id,text,bad){
  var n=el(id); if(!n) return;
  n.innerHTML=text?('<div class="notice"'+(bad?' style="border-right-color:#b42318;background:#fef3f2"':'')+'>'+
    esc(text)+'</div>'):'';
}
function each(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel),fn); }
function on(id,ev,fn){ var n=el(id); if(n) n[ev]=fn; }

function wire(){
  each('[data-t]',function(b){ b.onclick=function(){ type=b.getAttribute('data-t'); runResult=null; render(); }; });
  each('[data-ei]',function(b){ b.onclick=function(){ editItem(b.getAttribute('data-ei')); }; });
  each('[data-sp]',function(b){ b.onclick=function(){ savePrice(b.getAttribute('data-sp')); }; });
  each('[data-u]',function(s){ s.onchange=function(){
    var x=document.querySelector('[data-ux="'+s.getAttribute('data-u')+'"]');
    if(x) x.style.display = s.value==='__OTHER__' ? '' : 'none'; }; });
  each('[data-oi]',function(b){ b.onclick=function(){ openInvoice(b.getAttribute('data-oi')); }; });
  each('[data-pdf]',function(b){ b.onclick=function(){ downloadPdf(b.getAttribute('data-pdf')); }; });
  each('[data-r]',function(b){ b.onclick=function(){ report=b.getAttribute('data-r'); render(); }; });
  each('[data-us]',function(b){ b.onclick=function(){ saveUserRole(b.getAttribute('data-us')); }; });
  each('[data-ut]',function(b){ b.onclick=function(){ toggleUser(b.getAttribute('data-ut')); }; });

  on('hm','onchange',function(e){ month=+e.target.value; render(); });
  on('dm','onchange',function(e){ month=+e.target.value; type=null; runResult=null; render(); });
  on('im','onchange',function(e){ month=+e.target.value; type=null; render(); });
  on('rt','onchange',function(e){ type=e.target.value; render(); });
  on('fysel','onchange',function(e){
    S.currentFy=Number(e.target.value)||null;
    reload().then(render).catch(function(){ msg('fymsg',offline(),1); });
  });
  on('tysearch','oninput',function(e){
    var tb=el('tyrows'); if(tb) tb.innerHTML=typeRows(e.target.value);
    each('[data-ei]',function(b){ b.onclick=function(){ editItem(b.getAttribute('data-ei')); }; });
  });
  on('tyabsave','onclick',saveTypeAnnual);
  on('addfy','onclick',addFy); on('delfy','onclick',delFy);
  on('addtype','onclick',addType); on('additem','onclick',addItem);
  on('edittype','onclick',function(){ editType(type); });
  on('saveb','onclick',saveBudgets);
  on('printb','onclick',function(){ window.print(); });
  on('xlb','onclick',exportBudgets);
  on('start','onclick',startRun); on('approve','onclick',approveRun);
  on('au','onclick',addUser);
  on('rprint','onclick',function(){ window.print(); });
  on('rxl','onclick',exportReport);
  /* printing an open invoice goes through the same single-invoice path, so a
     printed page and a saved PDF are the same document */
  on('iprint','onclick',function(){ if(openInv) downloadPdf(openInv.id); });
  on('ixl','onclick',exportInvoice);
  on('isave','onclick',saveInvoiceEdits);
}

function addFy(){

function nextId(list,prefix,width){
  var max=0;
  list.forEach(function(x){
    var m=new RegExp('^'+prefix+'(\\d+)$').exec(x);
    if(m&&+m[1]>max) max=+m[1]; });
  if(!max) return null;
  var n=String(max+1); while(n.length<width) n='0'+n;
  return prefix+n;
}

/* Saves the annual budget for one expense type, keeping whatever monthly
   distribution already exists. The server refuses a figure below what has been
   distributed, so the two can never disagree. */

  var v=num(el('tyab').value);

  var mm=months(type);
  var sum=mm.reduce(function(a,b){ return a+(b==null?0:Number(b)); },0);
  if(sum-v>0.005){
    msg('tyabmsg','الموزَّع شهريًا '+money(sum)+' يتجاوز هذه الموازنة — عدّل التوزيع أولًا.',1);
    return;
  }
  el('tyabsave').disabled=true;
  api('upsertBudget',{source:'LIVE',budget:{fyId:'FY'+fy(),typeId:type,
      annual:v,months:mm}})
    .then(function(r){
      el('tyabsave').disabled=false;
      if(!r||r.ok!==true){ msg('tyabmsg',emsg(r),1); return; }
      return reload().then(function(){
        render();
        msg('tyabmsg','حُفظت الموازنة السنوية لـ«'+typeBy(type).n+'» — '+money(v)+
          '  ·  المتبقي للتوزيع '+money(r2(v-sum)));
      });
    })
    .catch(function(){ el('tyabsave').disabled=false;
      msg('tyabmsg',offline()+' لم يُحفظ.',1); });
}
function saveBudgets(){
  var jobs=[];
  S.types.forEach(function(t){
    /* the annual figure comes from what is stored, never from this table */
    var rec=annualRec(t.id);
    var annualV=rec?rec.amount:null;
    var mm=[];
    for(var m=0;m<12;m++){
      var n=document.querySelector('[data-b="'+t.id+'|'+m+'"]');
      mm.push(n?num(n.value):null);
    }
    var sum=mm.reduce(function(a,b){ return a+(b==null?0:b); },0);
    if(annualV===null&&!mm.some(function(x){ return x!=null; })) return;
    if(annualV===null&&mm.some(function(x){ return x!=null; })){
      jobs.push({fail:'«'+t.n+'»: أدخل الموازنة السنوية من «أنواع المصروفات» قبل التوزيع.'});
      return;
    }
    if(annualV!==null&&sum-annualV>0.005){
      jobs.push({fail:'«'+t.n+'»: مجموع الشهور '+money(sum)+' يتجاوز الموازنة السنوية '+money(annualV)});
      return;
    }
    jobs.push({typeId:t.id,annual:annualV,months:mm});
  });
  var bad=jobs.filter(function(j){ return j.fail; });
  if(bad.length){ msg('bumsg',bad[0].fail,1); return; }
  var chain=Promise.resolve(), failed=null, done=0;
  jobs.forEach(function(j){
    chain=chain.then(function(){
      if(failed) return;
      return api('upsertBudget',{source:'LIVE',budget:{fyId:'FY'+fy(),typeId:j.typeId,
        annual:j.annual,months:j.months}})
        .then(function(r){ if(!r||r.ok!==true) failed=r; else done++; });
    });
  });
  chain.then(function(){
    if(failed){ msg('bumsg',emsg(failed),1); return; }
    return reload().then(function(){ render(); msg('bumsg','حُفظ '+done+' نوع مصروف.'); });
  }).catch(function(){ msg('bumsg',offline()+' لم يُحفظ.',1); });
}

/* ---------- exports, using a CSV the spreadsheet opens cleanly ---------- */
function download(name,text,mime){
  try{
    var blob=new Blob(['\ufeff'+text],{type:mime||'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    return true;
  }catch(e){ return false; }
}
function csv(head,rows){
  function cell(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }
  return [head.map(cell).join(',')].concat(rows.map(function(r){
    return r.map(cell).join(','); })).join('\r\n');
}
function exportBudgets(){
  var head=['نوع المصروف','الموازنة السنوية'].concat(M).concat(['الإجمالي','المتبقي']);

    var mm=months(t.id);
    var tot=mm.reduce(function(a,b){ return a+(b==null?0:Number(b)); },0);
    return [t.n,annual(t.id)].concat(mm.map(function(v){ return v==null?'':v; }))
      .concat([r2(tot),r2(annual(t.id)-tot)]);
  });
  download('budgets-'+fyLabel().replace('/','-')+'.csv',csv(head,rows));
}

  var rows=v.lines.map(function(l){
    var g=r2(l.price*l.quantity);
    var share=v.gross>0?r2(v.discount*(g/v.gross)):0;
    return [l.itemName,l.unit,l.price,l.quantity,g,r2(g-r2(g/(1+S.vat))),share,r2(g-share)];
  });
  rows.push(['','','','',v.gross,v.tax,v.discount,v.net]);
  download(v.id+'.csv',csv(head,rows));
}

/* ============================================================================
   BOOT AND PERSISTENT LOGIN

   The token is the only thing that survives a refresh, and it is not trusted
   on its own: the page asks the server who it belongs to before showing
   anything. The role that comes back is the role that applies — a token
   edited by hand in the browser's storage gets a refusal, not an upgrade.

   #app starts hidden and #login starts hidden too, so a returning user never
   sees the sign-in box flash before the dashboard appears.
   ========================================================================== */
function showLogin(){
  el('login').classList.remove('hidden');
  el('app').classList.add('hidden');
  var p=el('lp'); if(p) p.value='';
  var box=el('le'); if(box && box.textContent.indexOf('تعذّر تحميل')===0) box.textContent='';
}
function showApp(){
  el('login').classList.add('hidden');
  el('app').classList.remove('hidden');
}
function startSession(){
  /* the fiscal year is restored from the server's list, not from the browser */
  return reload().then(function(r){
    if(!r||r.ok!==true){
      if(r&&r.error==='INVALID_SESSION'){ showLogin(); return; }
      showApp(); page='home'; render();
      msg('fymsg',emsg(r),1);
      return;
    }
    showApp();
    page='home'; type=null;
    render();
    if(adm()) loadUsers().then(function(){ if(page==='users') render(); });
  });
}
function boot(){
  var saved=readToken();
  if(!saved){ showLogin(); return Promise.resolve(); }
  /* a stored token is a claim, not a credential: the server confirms it */
  TOKEN=saved;
  return api('session',{token:saved})
    .then(function(r){
      if(!r||r.ok!==true||!r.user){
        clearSession();
        showLogin();
        return;
      }
      USER={username:r.user.username,role:r.user.role,id:r.user.userId};
      return startSession();
    })
    .catch(function(){
      /* the network failed — the token is kept, but nothing is shown as
         authenticated until the server has actually answered */
      showLogin();
      el('le').textContent='تعذر الوصول إلى الخادم — أعد المحاولة.';
    });
}
function doLogin(){
  var b=el('loginBtn');
  b.disabled=true;
  el('le').textContent='جارٍ التحقق…';
  api('login',{username:el('lu').value,password:el('lp').value})
    .then(function(r){
      b.disabled=false;
      if(!r||r.ok!==true){ el('le').textContent=emsg(r); return; }
      storeToken(r.token);                 /* the token, and nothing else */
      USER={username:r.user.username,role:r.user.role,id:r.user.userId};
      el('lp').value='';                   /* the password is dropped at once */
      el('le').textContent='';
      return startSession();
    })
    .catch(function(){ b.disabled=false; el('le').textContent=offline(); });
}
function doLogout(){
  var t=TOKEN;
  clearSession();
  S.currentFy=null; S.prices={}; S.limits={}; S.annual={}; S.monthly={};
  S.invoices=[]; S.executions=[]; S.users=[];
  page='home'; type=null; runResult=null;
  showLogin();
  if(t) api('logout',{token:t}).catch(function(){});
}

/* ---------- wiring that lives outside the rendered content ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){
  b.onclick=function(){ go(b.getAttribute('data-p')); };
});
el('loginBtn').onclick=doLogin;
el('lp').onkeydown=function(e){ if(e.key==='Enter') doLogin(); };
el('lu').onkeydown=function(e){ if(e.key==='Enter') doLogin(); };
el('logout').onclick=doLogout;
el('modalback').onclick=function(e){ if(e.target===el('modalback')) closeM(); };

/* master data ships with the page: 10 types, 653 items, their ids and their
   relationships. It is shared across every fiscal year and is not re-fetched. */
(function(){
  var D=window.GHS_DATA||{};
  S.types=(D.types||[]).map(function(t){
    return {id:t.id,n:t.n,icon:icon(t.id),nameHistory:t.nameHistory||[]}; });
  S.items=(D.items||[]).map(function(i){
    return {id:i.i||i.id,t:i.t,n:i.n,nameHistory:i.nameHistory||[]}; });
})();

boot();

/* the app is exposed for testing only; nothing here grants any authority */
window.GHIS={ go:go, render:render, state:S,
  user:function(){ return USER; }, isAdmin:adm,
  token:function(){ return TOKEN; },
  login:doLogin, logout:doLogout, boot:boot,
  distribute:distribute, month:function(m){ if(m!=null) month=m; return month; },
  setType:function(t){ type=t; }, page:function(){ return page; } };
})();

</script>
<script>
/* the service worker is registered after load so a failed registration can
   never block the sign-in path */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
